                title: "voice",
                description: "ボーカル部分だけ抽出",
                audioFile: "music/voice.mp3",
                albumArt: "music/cover voice.png",
                lyrics: 
                    `3曲目の歌詞
                    ...`
            }
        ];

        // 要素の取得
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const repeatOne = document.getElementById('repeatOne');
        const lyricsBtn = document.getElementById('lyricsBtn');
        const shareBtn = document.getElementById('shareBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTime = document.getElementById('currentTime');
        const duration = document.getElementById('duration');
        const currentTitle = document.getElementById('currentTitle');
        const currentDescription = document.getElementById('currentDescription');
        const currentAlbumImg = document.getElementById('currentAlbumImg');
        const playlistContainer = document.getElementById('playlistContainer');
        const lyricsModal = document.getElementById('lyricsModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        let currentTrackIndex = 0;
        let isPlaying = false;
        let repeatMode = 'off'; // 'off', 'all', 'one'

        // プレイリストを生成
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (index === currentTrackIndex) {
                    item.classList.add('active');
                }
                item.innerHTML = `
                    <div class="playlist-number">${index + 1}</div>
                    <div class="playlist-album-art">
                        <img src="${track.albumArt}" alt="${track.title}">
                    </div>
                    <div class="playlist-details">
                        <div class="playlist-track-title">${track.title}</div>
                        <div class="playlist-track-description">${track.description}</div>
                    </div>
                `;
                item.addEventListener('click', () => loadTrack(index));
                playlistContainer.appendChild(item);
            });
        }

        // 曲を読み込む
        function loadTrack(index) {
            if (index < 0 || index >= tracks.length) return;
            
            currentTrackIndex = index;
            const track = tracks[index];
            
            audioPlayer.src = track.audioFile;
            currentTitle.textContent = track.title;
            currentDescription.textContent = track.description;
            currentAlbumImg.src = track.albumArt;
            
            renderPlaylist();
            
            // リピート状態は保持（リセットしない）
            
            if (isPlaying) {
                audioPlayer.play();
            }
        }

        // 再生/停止
        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.textContent = '▶';
                isPlaying = false;
                // リピート状態は保持（リセットしない）
            } else {
                audioPlayer.play();
                playBtn.textContent = '⏸';
                isPlaying = true;
            }
        }

        // リピートのオン/オフ（3段階）
        function toggleRepeat() {
            // off → all → one → off
            if (repeatMode === 'off') {
                repeatMode = 'all';
            } else if (repeatMode === 'all') {
                repeatMode = 'one';
            } else {
                repeatMode = 'off';
            }
            
            updateRepeatButton();
        }
        
        // リピートボタンの表示を更新
        function updateRepeatButton() {
            const isDark = document.body.classList.contains('dark-mode');
            
            if (repeatMode === 'off') {
                // オフ：グレー、1を非表示
                repeatBtn.style.color = isDark ? '#999' : '#666';
                repeatOne.style.display = 'none';
            } else if (repeatMode === 'all') {
                // 全体リピート：青色、1を非表示
                repeatBtn.style.color = isDark ? '#4a9eff' : '#0066cc';
                repeatOne.style.display = 'none';
            } else if (repeatMode === 'one') {
                // 1曲リピート：青色、1を表示
                repeatBtn.style.color = isDark ? '#4a9eff' : '#0066cc';
                repeatOne.style.display = 'block';
                repeatOne.style.color = isDark ? '#4a9eff' : '#0066cc';
            }
        }

        // 時間のフォーマット
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // プログレスバーの更新
        function updateProgress() {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTime.textContent = formatTime(audioPlayer.currentTime);
        }

        // プログレスバーのクリック
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        // Blueskyシェア
        shareBtn.addEventListener('click', () => {
            const track = tracks[currentTrackIndex];
            const url = window.location.href;
            const text = `🎵 "${track.title}" を聴いています`;
            const blueskyUrl = `https://bsky.app/intent/compose?text=${encodeURIComponent(text + '\n' + url)}`;
            window.open(blueskyUrl, '_blank');
        });

        // 歌詞モーダルを開く
        function openLyricsModal() {
            const track = tracks[currentTrackIndex];
            modalTitle.textContent = track.title;
            modalBody.innerHTML = `<p>${track.lyrics.replace(/\n/g, '<br>')}</p>`;
            lyricsModal.classList.add('active');
            // スクロールは止めない（背景が透けて見えるように）
        }

        // 歌詞モーダルを閉じる
        function closeLyricsModal() {
            lyricsModal.classList.remove('active');
        }

        // 歌詞ボタンのイベント
        let lyricsTouchHandled = false;
        
        lyricsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            lyricsTouchHandled = true;
            openLyricsModal();
            setTimeout(() => { lyricsTouchHandled = false; }, 300);
        });
        
        lyricsBtn.addEventListener('click', (e) => {
            if (!lyricsTouchHandled) {
                openLyricsModal();
            }
        });

        // モーダルを閉じるイベント
        modalClose.addEventListener('click', closeLyricsModal);
        
        lyricsModal.addEventListener('click', (e) => {
            if (e.target === lyricsModal) {
                closeLyricsModal();
            }
        });

        // イベントリスナー
        playBtn.addEventListener('click', togglePlay);
        
        // リピートボタン：タッチデバイスとマウスの両方に対応
        let repeatTouchHandled = false;
        
        repeatBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            repeatTouchHandled = true;
            toggleRepeat();
            setTimeout(() => { repeatTouchHandled = false; }, 300);
        });
        
        repeatBtn.addEventListener('click', (e) => {
            if (!repeatTouchHandled) {
                toggleRepeat();
            }
        });
        
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('loadedmetadata', () => {
            duration.textContent = formatTime(audioPlayer.duration);
        });
        audioPlayer.addEventListener('ended', () => {
            if (repeatMode === 'one') {
                // 1曲リピート：同じ曲をもう一度再生
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } else if (currentTrackIndex < tracks.length - 1) {
                // 次の曲があれば自動再生
                loadTrack(currentTrackIndex + 1);
                audioPlayer.play();
            } else {
                // 最後の曲が終わった場合
                if (repeatMode === 'all') {
                    // 全体リピートONなら最初から
                    loadTrack(0);
                    audioPlayer.play();
                } else {
                    // リピートOFFなら停止
                    playBtn.textContent = '▶';
                    isPlaying = false;
                    progressFill.style.width = '0%';
                    currentTime.textContent = '0:00';
                }
            }
        });

        // 初期化
        loadTrack(0);
        renderPlaylist();
    </script>
</body>
</html>
