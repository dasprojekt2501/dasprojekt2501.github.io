<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Urban Soundscape — PLATEAU × deck.gl × Tone.js</title>

<!-- MapLibre GL JS -->
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

<!-- deck.gl -->
<script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/core@^9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/layers@^9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/mesh-layers@^9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/@deck.gl/geo-layers@^9.0.0/dist.min.js"></script>

<!-- loaders.gl for 3D Tiles -->
<script src="https://unpkg.com/@loaders.gl/3d-tiles@^3.4.0/dist/dist.min.js"></script>

<!-- Tone.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&display=swap');

  :root {
    --bg: #050505;
    --fg: #d0d0d0;
    --accent: #00ffcc;
    --accent-dim: rgba(0,255,204,0.15);
    --red: #ff3355;
    --blue: #3388ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  #start-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(5,5,5,0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease;
  }

  #start-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .start-title {
    font-size: 11px;
    font-weight: 200;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--fg);
    margin-bottom: 6px;
  }

  .start-sub {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 3px;
    color: var(--fg);
    opacity: 0.3;
    margin-bottom: 6px;
    text-align: center;
    line-height: 1.8;
  }

  .start-desc {
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: 0.5;
    margin-bottom: 36px;
    text-align: center;
    line-height: 1.8;
    max-width: 360px;
  }

  #start-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }

  #start-btn:hover, #start-btn:active {
    background: var(--accent);
    color: var(--bg);
  }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(5,5,5,0.6) 0%, transparent 100%);
  }

  .logo {
    font-size: 10px;
    font-weight: 200;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .logo span { color: var(--accent); opacity: 1; }

  .status {
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.3;
    text-align: right;
  }

  .status .live {
    color: var(--accent);
    opacity: 1;
  }

  .data-panel {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 100;
    pointer-events: none;
    background: rgba(5,5,5,0.7);
    padding: 12px 16px;
    border-left: 1px solid var(--accent-dim);
  }

  .data-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 3px;
    transition: opacity 0.3s;
  }

  .data-label {
    font-size: 7px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--fg);
    opacity: 0.3;
    min-width: 64px;
  }

  .data-value {
    font-size: 11px;
    font-weight: 400;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .wave-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
    pointer-events: none;
  }

  #waveform {
    width: 180px;
    height: 50px;
    opacity: 0.5;
  }

  .area-selector {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    gap: 2px;
  }

  .area-btn {
    background: rgba(5,5,5,0.6);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--fg);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 2px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    text-transform: uppercase;
  }

  .area-btn:hover {
    border-color: rgba(255,255,255,0.2);
  }

  .area-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,204,0.05);
  }

  .crosshair {
    position: fixed;
    pointer-events: none;
    z-index: 90;
    display: none;
  }

  .crosshair.show { display: block; }

  .crosshair-h, .crosshair-v {
    position: fixed;
    background: rgba(0,255,204,0.08);
  }

  .crosshair-h {
    left: 0;
    right: 0;
    height: 1px;
  }

  .crosshair-v {
    top: 0;
    bottom: 0;
    width: 1px;
  }

  .crosshair-dot {
    position: fixed;
    width: 6px;
    height: 6px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 80;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px
    );
  }

  .loading-indicator {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }

  .loading-indicator.show { opacity: 0.5; }

  @media (max-width: 768px) {
    .area-btn { font-size: 7px; padding: 5px 8px; letter-spacing: 1px; }
    .data-panel { bottom: 12px; left: 12px; padding: 8px 12px; }
    .data-label { font-size: 6px; min-width: 50px; }
    .data-value { font-size: 9px; }
    .wave-panel { bottom: 12px; right: 12px; }
    #waveform { width: 120px; height: 36px; }
    .header { padding: 10px 14px; }
    .area-selector { top: 10px; }
  }

  .maplibregl-ctrl-bottom-left,
  .maplibregl-ctrl-bottom-right {
    opacity: 0.15;
    font-size: 8px;
  }
</style>
</head>
<body>

<div id="start-overlay">
  <div class="start-title">Urban Soundscape</div>
  <div class="start-sub">
    PLATEAU 3D City Model × deck.gl × Tone.js
  </div>
  <div class="start-desc">
    Navigate Tokyo's 3D cityscape.<br>
    Building density, height, and proximity<br>
    are translated into sound in real time.
  </div>
  <button id="start-btn">Enter</button>
</div>

<div class="scanlines"></div>

<div class="header">
  <div class="logo"><span>Urban</span> Soundscape</div>
  <div class="status">
    <span class="live" id="status-text">● Loading</span>
  </div>
</div>

<div class="area-selector" id="area-selector">
  <button class="area-btn active" data-area="chiyoda">千代田</button>
  <button class="area-btn" data-area="chuo">中央</button>
  <button class="area-btn" data-area="minato">港</button>
  <button class="area-btn" data-area="shinjuku">新宿</button>
  <button class="area-btn" data-area="shibuya">渋谷</button>
</div>

<div id="map"></div>

<div class="crosshair" id="crosshair">
  <div class="crosshair-h" id="ch-h"></div>
  <div class="crosshair-v" id="ch-v"></div>
  <div class="crosshair-dot" id="ch-dot"></div>
</div>

<div class="data-panel" id="data-panel">
  <div class="data-row">
    <span class="data-label">Lat</span>
    <span class="data-value" id="val-lat">—</span>
  </div>
  <div class="data-row">
    <span class="data-label">Lng</span>
    <span class="data-value" id="val-lng">—</span>
  </div>
  <div class="data-row">
    <span class="data-label">Tiles</span>
    <span class="data-value" id="val-tiles">0</span>
  </div>
  <div class="data-row">
    <span class="data-label">Density</span>
    <span class="data-value" id="val-density">—</span>
  </div>
  <div class="data-row">
    <span class="data-label">Freq</span>
    <span class="data-value" id="val-freq">—</span>
  </div>
  <div class="data-row">
    <span class="data-label">BPM</span>
    <span class="data-value" id="val-bpm">—</span>
  </div>
</div>

<div class="wave-panel">
  <canvas id="waveform" width="360" height="100"></canvas>
</div>

<div class="loading-indicator" id="loading">Loading 3D Tiles...</div>

<script>
const AREAS = {
  chiyoda: {
    name: '千代田区',
    nameEn: 'Chiyoda',
    tiles: 'https://plateau.geospatial.jp/main/data/3d-tiles/bldg/13100_tokyo/13101_chiyoda-ku/notexture/tileset.json',
    center: [139.7528, 35.6938],
    zoom: 15.5,
    pitch: 55,
    bearing: -20,
    density: 0.90,
  },
  chuo: {
    name: '中央区',
    nameEn: 'Chuo',
    tiles: 'https://plateau.geospatial.jp/main/data/3d-tiles/bldg/13100_tokyo/13102_chuo-ku/notexture/tileset.json',
    center: [139.7745, 35.6717],
    zoom: 15.5,
    pitch: 55,
    bearing: 10,
    density: 0.85,
  },
  minato: {
    name: '港区',
    nameEn: 'Minato',
    tiles: 'https://plateau.geospatial.jp/main/data/3d-tiles/bldg/13100_tokyo/13103_minato-ku/notexture/tileset.json',
    center: [139.7400, 35.6580],
    zoom: 15.5,
    pitch: 55,
    bearing: -30,
    density: 0.82,
  },
  shinjuku: {
    name: '新宿区',
    nameEn: 'Shinjuku',
    tiles: 'https://plateau.geospatial.jp/main/data/3d-tiles/bldg/13100_tokyo/13104_shinjuku-ku/notexture/tileset.json',
    center: [139.6917, 35.6895],
    zoom: 15.5,
    pitch: 55,
    bearing: 15,
    density: 0.88,
  },
  shibuya: {
    name: '渋谷区',
    nameEn: 'Shibuya',
    tiles: 'https://plateau.geospatial.jp/main/data/3d-tiles/bldg/13100_tokyo/13113_shibuya-ku/notexture/tileset.json',
    center: [139.6981, 35.6636],
    zoom: 15.5,
    pitch: 55,
    bearing: -10,
    density: 0.86,
  },
};

let currentArea = 'chiyoda';
let audioStarted = false;
let tileCount = 0;
let map, deckOverlay;

let synths = {};
let masterGain, analyser;

async function initAudio() {
  await Tone.start();
  if (Tone.context.state !== 'running') {
    await Tone.context.resume();
  }

  masterGain = new Tone.Gain(0.25).toDestination();

  const clickFilter = new Tone.Filter(4000, "bandpass", -12).connect(masterGain);
  synths.click = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.01, sustain: 0, release: 0.008 }
  }).connect(new Tone.Gain(0.6).connect(clickFilter));

  synths.sine = new Tone.Oscillator({ type: "sine", frequency: 50, volume: -22 }).connect(masterGain);
  synths.sine.start();

  const highFilter = new Tone.Filter(6000, "highpass").connect(masterGain);
  synths.micro = new Tone.Oscillator({ type: "sine", frequency: 3000, volume: -38 }).connect(highFilter);
  synths.micro.start();

  const noiseFilter = new Tone.Filter(600, "lowpass", -12).connect(masterGain);
  synths.noiseGain = new Tone.Gain(0).connect(noiseFilter);
  synths.noise = new Tone.Noise("brown").connect(synths.noiseGain);
  synths.noise.start();

  const pingFilter = new Tone.Filter(2000, "bandpass", -6).connect(masterGain);
  synths.ping = new Tone.MetalSynth({
    frequency: 200,
    envelope: { attack: 0.001, decay: 0.4, release: 0.2 },
    harmonicity: 5.1,
    modulationIndex: 16,
    resonance: 4000,
    octaves: 1.5,
    volume: -30
  }).connect(pingFilter);

  synths.clickLoop = new Tone.Loop((time) => {
    if (audioStarted) {
      synths.click.triggerAttackRelease("32n", time);
    }
  }, "8n").start(0);

  Tone.Transport.bpm.value = 100;
  Tone.Transport.start();

  analyser = new Tone.Analyser("waveform", 256);
  masterGain.connect(analyser);
}

function updateSoundFromMap() {
  if (!audioStarted || !synths.sine) return;

  const zoom = map.getZoom();
  const pitch = map.getPitch();
  const area = AREAS[currentArea];

  const zoomNorm = Math.max(0, Math.min(1, (zoom - 12) / 6));
  const microFreq = 1500 + zoomNorm * 6000;
  synths.micro.frequency.rampTo(microFreq, 0.4);
  synths.micro.volume.rampTo(-42 + zoomNorm * 15, 0.4);

  const pitchNorm = pitch / 80;
  const subFreq = 35 + pitchNorm * 40;
  synths.sine.frequency.rampTo(subFreq, 0.5);

  const density = area.density;
  synths.noiseGain.gain.rampTo(density * 0.12 * zoomNorm, 0.5);

  const bpm = 60 + zoomNorm * 120;
  Tone.Transport.bpm.rampTo(bpm, 1);

  masterGain.gain.rampTo(0.1 + zoomNorm * 0.2, 0.3);

  document.getElementById('val-freq').textContent = microFreq.toFixed(0) + ' Hz';
  document.getElementById('val-bpm').textContent = bpm.toFixed(0);
  document.getElementById('val-density').textContent = (density * 100).toFixed(0) + '%';
}

function triggerAreaPing() {
  if (!audioStarted || !synths.ping) return;
  synths.ping.triggerAttackRelease("16n", Tone.now());
}

const waveCanvas = document.getElementById('waveform');
const waveCtx = waveCanvas.getContext('2d');

function drawWaveform() {
  if (!analyser) {
    requestAnimationFrame(drawWaveform);
    return;
  }

  const data = analyser.getValue();
  waveCtx.clearRect(0, 0, 360, 100);

  waveCtx.strokeStyle = 'rgba(0,255,204,0.5)';
  waveCtx.lineWidth = 1;
  waveCtx.beginPath();
  const sliceW = 360 / data.length;
  for (let i = 0; i < data.length; i++) {
    const y = 50 + data[i] * 45;
    i === 0 ? waveCtx.moveTo(0, y) : waveCtx.lineTo(i * sliceW, y);
  }
  waveCtx.stroke();

  waveCtx.strokeStyle = 'rgba(255,255,255,0.04)';
  waveCtx.beginPath();
  waveCtx.moveTo(0, 50);
  waveCtx.lineTo(360, 50);
  waveCtx.stroke();

  requestAnimationFrame(drawWaveform);
}

function initMap() {
  const area = AREAS[currentArea];

  map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {},
      layers: [{
        id: 'background',
        type: 'background',
        paint: { 'background-color': '#050505' }
      }],
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    },
    center: area.center,
    zoom: area.zoom,
    pitch: area.pitch,
    bearing: area.bearing,
    maxPitch: 75,
    antialias: true,
  });

  map.on('load', () => {
    loadTiles(currentArea);
    document.getElementById('status-text').textContent = '● Live';
  });

  map.on('move', () => {
    updateSoundFromMap();
    updateCoords();
  });

  map.getCanvas().addEventListener('mousemove', (e) => {
    updateCrosshair(e.clientX, e.clientY);
  });

  map.getCanvas().addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    updateCrosshair(t.clientX, t.clientY);
  });
}

function updateCoords() {
  const center = map.getCenter();
  document.getElementById('val-lat').textContent = center.lat.toFixed(5);
  document.getElementById('val-lng').textContent = center.lng.toFixed(5);
}

function updateCrosshair(x, y) {
  const ch = document.getElementById('crosshair');
  ch.classList.add('show');
  document.getElementById('ch-h').style.top = y + 'px';
  document.getElementById('ch-v').style.left = x + 'px';
  const dot = document.getElementById('ch-dot');
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
}

function loadTiles(areaKey) {
  const area = AREAS[areaKey];
  tileCount = 0;

  document.getElementById('loading').classList.add('show');

  if (deckOverlay) {
    map.removeControl(deckOverlay);
  }

  const tileLayer = new deck.Tile3DLayer({
    id: 'plateau-bldg-' + areaKey,
    data: area.tiles,
    opacity: 0.85,

    _getMeshColor: () => {
      return [20, 60, 55, 200];
    },

    onTilesetLoad: (tileset) => {
      document.getElementById('loading').classList.remove('show');

      if (tileset.cartographicCenter) {
        map.flyTo({
          center: [tileset.cartographicCenter[0], tileset.cartographicCenter[1]],
          zoom: area.zoom,
          pitch: area.pitch,
          bearing: area.bearing,
          duration: 2000,
          essential: true
        });
      }
    },

    onTileLoad: () => {
      tileCount++;
      document.getElementById('val-tiles').textContent = tileCount;
    },

    onTileError: (_tile, message) => {
      console.warn('Tile error:', message);
    },
  });

  deckOverlay = new deck.MapboxOverlay({
    interleaved: true,
    layers: [tileLayer],
  });

  map.addControl(deckOverlay);
}

document.getElementById('area-selector').addEventListener('click', (e) => {
  const btn = e.target.closest('.area-btn');
  if (!btn) return;

  const areaKey = btn.dataset.area;
  if (areaKey === currentArea) return;

  document.querySelectorAll('.area-btn').forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');

  currentArea = areaKey;
  const area = AREAS[areaKey];

  map.flyTo({
    center: area.center,
    zoom: area.zoom,
    pitch: area.pitch,
    bearing: area.bearing,
    duration: 2500,
    essential: true
  });

  loadTiles(areaKey);
  triggerAreaPing();
});

async function handleStart() {
  const overlay = document.getElementById('start-overlay');
  if (overlay.classList.contains('hidden')) return;
  overlay.classList.add('hidden');

  audioStarted = true;
  await initAudio();
  initMap();
  drawWaveform();
  updateSoundFromMap();
}

document.getElementById('start-btn').addEventListener('click', handleStart);
document.getElementById('start-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  handleStart();
});
</script>
</body>
</html>
