<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PULSE // リズム × ハプティクス</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0a0a;--fg:#e8e8e8;--accent:#00ff88;--miss:#ff3355;--dim:#444}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:'IBM Plex Mono',monospace;
    /* Use touch-action instead of preventDefault to block zoom/scroll */
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
  .screen.hidden{opacity:0;pointer-events:none}
  .haptic-switch{position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none}

  #title h1{font-size:2.6rem;font-weight:700;letter-spacing:.3em;margin-bottom:.15em}
  .sub{font-size:.7rem;font-weight:300;letter-spacing:.5em;color:var(--dim);margin-bottom:2em;text-transform:uppercase}
  .song-row{display:flex;gap:10px;margin-bottom:1.8em}
  .sbtn{background:none;border:1px solid var(--dim);color:var(--dim);font-family:inherit;font-size:.65rem;letter-spacing:.1em;padding:9px 18px;cursor:pointer;transition:all .15s;display:inline-block}
  .sbtn.on{border-color:var(--accent);color:var(--accent)}
  .go{background:none;border:1px solid var(--accent);color:var(--accent);font-family:inherit;font-size:.85rem;letter-spacing:.2em;padding:13px 44px;cursor:pointer;display:inline-block}
  .go:active{background:var(--accent);color:var(--bg)}
  .info{margin-top:1.5em;font-size:.5rem;letter-spacing:.1em;color:var(--dim);text-align:center;line-height:1.8}
  .test-area{margin-top:1.4em;display:flex;flex-direction:column;align-items:center;gap:10px}
  .test-label{background:none;border:1px solid #666;color:#999;font-family:inherit;font-size:.6rem;letter-spacing:.08em;padding:10px 20px;cursor:pointer;display:inline-block}
  .test-label:active{border-color:var(--accent);color:var(--accent)}
  .test-msg{font-size:.5rem;color:var(--dim);letter-spacing:.05em;min-height:1.2em}

  .hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
  .hud-score{font-size:1.6rem;font-weight:700}
  .hud-combo{font-size:.65rem;letter-spacing:.12em;color:var(--dim);margin-top:3px}
  .hud-combo.hot{color:var(--accent)}
  .hud-r{text-align:right}
  .hud-song{font-size:.6rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .hud-bar{width:70px;height:2px;background:#222;margin-top:6px;margin-left:auto}
  .hud-fill{height:100%;background:var(--accent);width:0}

  .lanes{position:absolute;inset:0;display:flex;justify-content:center}
  .lane{width:72px;height:100%;position:relative;border-left:1px solid #141414;border-right:1px solid #141414}
  .hitline{position:absolute;bottom:110px;left:0;right:0;height:2px;background:var(--accent);opacity:.4;z-index:5;pointer-events:none}
  .hitglow{position:absolute;bottom:86px;left:0;right:0;height:52px;background:linear-gradient(to bottom,transparent,rgba(0,255,136,.04),transparent);z-index:4;pointer-events:none}

  .taplabel{
    position:absolute;bottom:0;left:0;right:0;height:220px;z-index:20;display:block;cursor:pointer;
    /* Ensure this element doesn't block native label behavior */
    touch-action:manipulation;
  }

  .note{position:absolute;left:50%;transform:translateX(-50%);width:42px;height:8px;border-radius:1px;z-index:3;pointer-events:none;will-change:bottom}
  .note-hat{background:#66aaff}
  .note-kick{background:#fff}
  .note-snare{background:#ff6644}
  .note-melody{background:var(--accent)}

  .flash{position:absolute;bottom:88px;left:0;right:0;height:55px;z-index:6;pointer-events:none;animation:fo .2s ease-out forwards}
  .flash.perfect{background:radial-gradient(ellipse at center bottom,rgba(0,255,136,.3),transparent 70%)}
  .flash.good{background:radial-gradient(ellipse at center bottom,rgba(232,232,232,.2),transparent 70%)}
  .flash.miss{background:radial-gradient(ellipse at center bottom,rgba(255,51,85,.2),transparent 70%)}
  @keyframes fo{0%{opacity:1}100%{opacity:0}}
  .judge{position:absolute;bottom:155px;left:0;right:0;text-align:center;font-size:.55rem;font-weight:700;letter-spacing:.2em;z-index:15;pointer-events:none;animation:ju .4s ease-out forwards}
  .judge.perfect{color:var(--accent)}.judge.good{color:var(--fg)}.judge.miss{color:var(--miss)}
  @keyframes ju{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}
  .bpm-lbl{position:absolute;bottom:14px;left:14px;font-size:.55rem;letter-spacing:.12em;color:var(--dim);z-index:10;pointer-events:none}

  .rtitle{font-size:.65rem;letter-spacing:.5em;color:var(--dim);margin-bottom:1.8em;text-transform:uppercase}
  .rscore{font-size:3.2rem;font-weight:700;margin-bottom:.3em}
  .rgrade{font-size:1.1rem;letter-spacing:.3em;margin-bottom:1.8em}
  .rgrade.s{color:var(--accent)}.rgrade.a{color:#88ccff}.rgrade.b{color:var(--fg)}.rgrade.c{color:var(--dim)}
  .rstats{display:grid;grid-template-columns:auto auto;gap:10px 32px;margin-bottom:2.5em;font-size:.65rem}
  .sl{color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:right}
  .sv{font-weight:700}.pf{color:var(--accent)}.ms{color:var(--miss)}
</style>
</head>
<body>

<!-- Hidden switches -->
<input type="checkbox" switch id="sw-test" class="haptic-switch">
<input type="checkbox" switch id="sw-start" class="haptic-switch">
<input type="checkbox" switch id="sw-retry" class="haptic-switch">
<input type="checkbox" switch id="sw-s1" class="haptic-switch">
<input type="checkbox" switch id="sw-s2" class="haptic-switch">
<input type="checkbox" switch id="sw-s3" class="haptic-switch">
<!-- Lane switches -->
<input type="checkbox" switch id="sw-lane0" class="haptic-switch">
<input type="checkbox" switch id="sw-lane1" class="haptic-switch">
<input type="checkbox" switch id="sw-lane2" class="haptic-switch">
<input type="checkbox" switch id="sw-lane3" class="haptic-switch">

<!-- TITLE -->
<div id="title" class="screen">
  <h1>PULSE</h1>
  <div class="sub">rhythm × haptics</div>
  <div class="song-row" id="songrow">
    <label for="sw-s1" class="sbtn on" id="btn-pulse" data-song="pulse">PULSE</label>
    <label for="sw-s2" class="sbtn" id="btn-grid" data-song="grid">GRID</label>
    <label for="sw-s3" class="sbtn" id="btn-sine" data-song="sine">SINE</label>
  </div>
  <label for="sw-start" class="go" id="gobtn">START</label>
  <div class="test-area">
    <label for="sw-test" class="test-label" id="testbtn">振動テスト（タップ）</label>
    <div class="test-msg" id="testmsg"></div>
  </div>
  <div class="info">iOS 18+ Safari でハプティクス対応<br>サウンドON・マナーモード解除推奨</div>
</div>

<!-- GAME -->
<div id="game" class="screen hidden">
  <div class="hud">
    <div><div class="hud-score" id="hscore">0</div><div class="hud-combo" id="hcombo">0 COMBO</div></div>
    <div class="hud-r"><div class="hud-song" id="hsong">PULSE</div><div class="hud-bar"><div class="hud-fill" id="hbar"></div></div></div>
  </div>
  <div class="lanes" id="lanes"></div>
  <div class="bpm-lbl" id="bpmlbl">120 BPM</div>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">
  <div class="rtitle">RESULT</div>
  <div class="rscore" id="rscore">0</div>
  <div class="rgrade" id="rgrade">-</div>
  <div class="rstats">
    <div class="sl">PERFECT</div><div class="sv pf" id="rpf">0</div>
    <div class="sl">GOOD</div><div class="sv" id="rgd">0</div>
    <div class="sl">MISS</div><div class="sv ms" id="rms">0</div>
    <div class="sl">MAX COMBO</div><div class="sv" id="rmc">0</div>
  </div>
  <label for="sw-retry" class="go" id="retrybtn">RETRY</label>
</div>

<script>
const $=id=>document.getElementById(id);

// ============================================================
// AUDIO
// ============================================================
let ctx=null,master=null;
function initAudio(){
  if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
  try{
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=1.0;master.connect(ctx.destination);
    const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();
    s.buffer=b;s.connect(ctx.destination);s.start(0);
  }catch(e){}
}
const NT={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,E5:659.25,G5:784};

function synth(freq,type,vol,atk,dec){
  if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+atk);
  g.gain.exponentialRampToValueAtTime(.001,t+atk+dec);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+atk+dec+.01);
}
function noise(vol,dur){
  if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime,len=ctx.sampleRate*dur|0;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource();src.buffer=buf;
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
  const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(hp);hp.connect(g);g.connect(master);src.start(t);src.stop(t+dur+.01);
}
function playKick(){
  if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime;
  let o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.26);
  o=ctx.createOscillator();g=ctx.createGain();
  o.type='square';o.frequency.setValueAtTime(800,t);
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.02);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.03);
}
function playSnare(){
  if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(120,t+.05);
  g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.11);
  noise(.5,.12);
}
function playHihat(){noise(.25,.05);}
function playMelody(freq){synth(freq,'sine',.35,.01,.25);synth(freq*2,'sine',.08,.01,.15);}
function playTick(acc){synth(acc?900:600,'sine',acc?.08:.04,.002,.03);}
function playMissSound(){synth(80,'sawtooth',.15,.005,.12);}
function playHitFx(type){
  if(type==='perfect')synth(NT.C5,'sine',.2,.005,.06);
  else if(type==='good')synth(NT.G4,'sine',.12,.005,.05);
}

// ============================================================
// SONGS
// ============================================================
function songPulse(){
  const n=[],mel=[NT.E4,NT.G4,NT.A4,NT.G4,NT.C5,NT.B4,NT.A4,NT.E4];let mi=0;
  for(let bar=0;bar<8;bar++){const b=bar*4;
    n.push([b,1,'kick'],[b+2,1,'kick'],[b+1,2,'snare'],[b+3,2,'snare']);
    for(let i=0;i<4;i++){n.push([b+i,0,'hat']);if(bar>=2)n.push([b+i+.5,0,'hat']);}
    n.push([b,3,'melody',mel[mi++%mel.length]]);
    if(bar>=4)n.push([b+2,3,'melody',mel[mi++%mel.length]]);
  }return n.sort((a,b)=>a[0]-b[0]);
}
function songGrid(){
  const n=[],bass=[NT.C4,NT.E4,NT.G4,NT.C4];
  for(let bar=0;bar<9;bar++){const b=bar*4;
    for(let i=0;i<4;i++)n.push([b+i,1,'kick']);
    for(let i=0;i<4;i++)n.push([b+i+.5,0,'hat']);
    n.push([b+1,2,'snare'],[b+3,2,'snare']);
    n.push([b,3,'melody',bass[bar%4]],[b+2.5,3,'melody',bass[(bar+1)%4]]);
    if(bar>=5)n.push([b+1.5,2,'snare'],[b+3.5,0,'hat']);
  }return n.sort((a,b)=>a[0]-b[0]);
}
function songSine(){
  const n=[],sc=[NT.C4,NT.D4,NT.E4,NT.G4,NT.A4,NT.C5,NT.E5];
  for(let bar=0;bar<7;bar++){const b=bar*4,idx=bar%sc.length;
    n.push([b,1,'kick']);if(bar%2===1)n.push([b+2,1,'kick']);
    n.push([b+2,2,'snare']);
    for(let i=0;i<4;i++)n.push([b+i,0,'hat']);
    n.push([b,3,'melody',sc[idx]],[b+1.5,3,'melody',sc[(idx+2)%sc.length]],[b+3,3,'melody',sc[(idx+4)%sc.length]]);
  }return n.sort((a,b)=>a[0]-b[0]);
}
const SONGS={pulse:{name:'PULSE',bpm:118,gen:songPulse},grid:{name:'GRID',bpm:128,gen:songGrid},sine:{name:'SINE',bpm:90,gen:songSine}};
const LANE_N=4,HIT_Y=110,PERF_MS=65,GOOD_MS=135,SPEED=420;
const NOTE_CLS=['note-hat','note-kick','note-snare','note-melody'];

// ============================================================
// STATE
// ============================================================
let sel='pulse',score=0,combo=0,maxC=0,pf=0,gd=0,ms=0;
let notes=[],t0=0,dur=0,beatMs=0,lastBeat=-1,run=false,raf=null;
const scr={title:$('title'),game:$('game'),result:$('result')};
function show(name){Object.entries(scr).forEach(([k,el])=>el.classList.toggle('hidden',k!==name));}

// ============================================================
// TITLE
// ============================================================
$('sw-test').addEventListener('change',()=>{initAudio();playKick();$('testmsg').textContent='振動を感じましたか？';});
const songBtns=[$('btn-pulse'),$('btn-grid'),$('btn-sine')];
['sw-s1','sw-s2','sw-s3'].forEach((id,i)=>{
  $(id).addEventListener('change',()=>{initAudio();playHihat();sel=songBtns[i].dataset.song;songBtns.forEach(b=>b.classList.remove('on'));songBtns[i].classList.add('on');});
});
$('sw-start').addEventListener('change',()=>{initAudio();startGame();});
$('sw-retry').addEventListener('change',()=>{initAudio();startGame();});

// ============================================================
// LANES
// ============================================================
const lanesEl=$('lanes');
function setupLanes(){
  lanesEl.innerHTML='';
  for(let i=0;i<LANE_N;i++){
    const l=document.createElement('div');l.className='lane';
    l.innerHTML='<div class="hitline"></div><div class="hitglow"></div>';
    const lbl=document.createElement('label');
    lbl.className='taplabel';
    lbl.setAttribute('for','sw-lane'+i);
    lbl.dataset.lane=i;
    l.appendChild(lbl);
    lanesEl.appendChild(l);
  }
}

function fx(lane,type){
  const l=lanesEl.children[lane];if(!l)return;
  const f=document.createElement('div');f.className='flash '+type;l.appendChild(f);setTimeout(()=>f.remove(),200);
  const j=document.createElement('div');j.className='judge '+type;j.textContent=type.toUpperCase();l.appendChild(j);setTimeout(()=>j.remove(),400);
}
function updHUD(){
  $('hscore').textContent=Math.floor(score);
  const c=$('hcombo');c.textContent=combo+' COMBO';c.className='hud-combo'+(combo>=5?' hot':'');
}

// ============================================================
// GAME
// ============================================================
function startGame(){
  const song=SONGS[sel];
  score=0;combo=0;maxC=0;pf=0;gd=0;ms=0;notes=[];lastBeat=-1;
  beatMs=60000/song.bpm;const raw=song.gen();
  dur=(Math.max(...raw.map(n=>n[0]))+4)*beatMs;
  setupLanes();updHUD();
  $('hsong').textContent=song.name;$('bpmlbl').textContent=song.bpm+' BPM';
  show('game');t0=performance.now()+2000;run=true;
  raw.forEach(([beat,lane,type,freq])=>{
    const el=document.createElement('div');el.className='note '+NOTE_CLS[lane];
    lanesEl.children[lane].appendChild(el);
    notes.push({el,lane,type,freq,targetTime:t0+beat*beatMs,hit:false,missed:false});
  });
  if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}

function loop(now){
  if(!run)return;
  const elapsed=now-t0;
  $('hbar').style.width=Math.max(0,Math.min(100,elapsed/dur*100))+'%';
  const cb=Math.floor(elapsed/beatMs);
  if(cb>=0&&cb!==lastBeat){lastBeat=cb;playTick(cb%4===0);}
  const sH=window.innerHeight,tMs=(sH-HIT_Y)/SPEED*1000;
  for(const n of notes){
    if(n.hit||n.missed)continue;
    const dt=n.targetTime-now,bottom=HIT_Y+(dt/tMs)*(sH-HIT_Y);
    if(bottom<-30){n.missed=true;n.el.style.display='none';ms++;combo=0;fx(n.lane,'miss');playMissSound();updHUD();continue;}
    n.el.style.bottom=bottom+'px';
  }
  if(elapsed>dur+1500){endGame();return;}
  raf=requestAnimationFrame(loop);
}

// ============================================================
// TAP HANDLING
// ============================================================
function doTap(lane,now){
  let best=null,bestD=Infinity;
  for(const n of notes){
    if(n.hit||n.missed||n.lane!==lane)continue;
    const d=Math.abs(n.targetTime-now);if(d<bestD){bestD=d;best=n;}
  }
  if(!best||bestD>GOOD_MS*1.5)return;
  best.hit=true;best.el.style.display='none';
  let type;
  if(bestD<=PERF_MS){
    type='perfect';pf++;score+=100*(1+combo*.03);combo++;
    if(best.type==='kick')playKick();else if(best.type==='snare')playSnare();
    else if(best.type==='hat')playHihat();else if(best.type==='melody')playMelody(best.freq||NT.E5);
    playHitFx('perfect');
  }else if(bestD<=GOOD_MS){
    type='good';gd++;score+=50*(1+combo*.015);combo++;
    if(best.type==='kick')playKick();else if(best.type==='snare')playSnare();
    else if(best.type==='hat')playHihat();else if(best.type==='melody')playMelody(best.freq||NT.E5);
    playHitFx('good');
  }else{type='miss';ms++;combo=0;playMissSound();}
  if(combo>maxC)maxC=combo;fx(best.lane,type);updHUD();
}

// CRITICAL: Use the switch 'change' events for haptic-linked taps
// This fires AFTER Safari has toggled the switch (and triggered haptics)
['sw-lane0','sw-lane1','sw-lane2','sw-lane3'].forEach((id,i)=>{
  $(id).addEventListener('change',()=>{
    doTap(i,performance.now());
  });
});

// ALSO: Use touchstart for precise timing (no preventDefault!)
// We do NOT call preventDefault() so the label→switch toggle happens naturally
lanesEl.addEventListener('touchstart',e=>{
  // DO NOT call e.preventDefault() - let the label toggle the switch for haptics!
  const now=performance.now();
  for(const t of e.changedTouches){
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(!el)continue;
    const tg=el.closest('.taplabel');
    if(tg)doTap(parseInt(tg.dataset.lane),now);
  }
},{passive:true}); // passive:true = we promise not to preventDefault

// Mouse fallback
lanesEl.addEventListener('mousedown',e=>{
  const tg=e.target.closest('.taplabel');
  if(tg)doTap(parseInt(tg.dataset.lane),performance.now());
});

// ============================================================
// END
// ============================================================
function endGame(){
  run=false;if(raf)cancelAnimationFrame(raf);
  const tot=pf+gd+ms,acc=tot>0?(pf+gd*.5)/tot:0;
  let grade,cls;
  if(acc>=.95&&ms===0){grade='S';cls='s';}
  else if(acc>=.85){grade='A';cls='a';}
  else if(acc>=.7){grade='B';cls='b';}
  else{grade='C';cls='c';}
  $('rscore').textContent=Math.floor(score);
  const g=$('rgrade');g.textContent='GRADE '+grade;g.className='rgrade '+cls;
  $('rpf').textContent=pf;$('rgd').textContent=gd;$('rms').textContent=ms;$('rmc').textContent=maxC;
  show('result');
}
</script>
</body>
</html>
