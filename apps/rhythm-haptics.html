<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PULSE // リズム × ハプティクス</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --fg: #e8e8e8;
    --accent: #00ff88;
    --miss: #ff3355;
    --dim: #333;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'IBM Plex Mono', monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ---- TITLE ---- */
  #title-screen h1 {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    margin-bottom: 0.2em;
  }
  .subtitle {
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.5em;
    color: var(--dim);
    margin-bottom: 2.5em;
    text-transform: uppercase;
  }
  .song-select {
    display: flex;
    gap: 12px;
    margin-bottom: 2em;
  }
  .song-btn {
    background: none;
    border: 1px solid var(--dim);
    color: var(--dim);
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .song-btn.selected {
    border-color: var(--accent);
    color: var(--accent);
  }
  .start-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    padding: 14px 48px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .start-btn:active {
    background: var(--accent);
    color: var(--bg);
  }
  .info-text {
    margin-top: 2em;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    color: var(--dim);
    text-align: center;
    line-height: 1.8;
  }

  /* ---- GAME ---- */
  .game-hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
  }
  .hud-score {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .hud-combo {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-top: 4px;
  }
  .hud-combo.active { color: var(--accent); }
  .hud-song {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
    text-align: right;
  }
  .hud-progress {
    width: 80px; height: 2px;
    background: var(--dim);
    margin-top: 8px;
    margin-left: auto;
  }
  .hud-progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
  }

  .lane-container {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
  }
  .lane {
    width: 72px;
    height: 100%;
    position: relative;
    border-left: 1px solid #161616;
    border-right: 1px solid #161616;
  }

  /* Hit zone line */
  .hit-zone-line {
    position: absolute;
    bottom: 110px;
    left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0.5;
    z-index: 5;
    pointer-events: none;
  }
  .hit-zone-glow {
    position: absolute;
    bottom: 88px;
    left: 0; right: 0;
    height: 48px;
    background: linear-gradient(to bottom, transparent, rgba(0,255,136,0.04), transparent);
    z-index: 4;
    pointer-events: none;
  }

  /* Tap targets at bottom of each lane */
  .tap-target {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 200px;
    z-index: 20;
  }

  /* Notes falling */
  .note {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 8px;
    background: var(--fg);
    border-radius: 1px;
    z-index: 3;
    pointer-events: none;
    will-change: bottom;
  }

  /* Effects */
  .hit-flash {
    position: absolute;
    bottom: 90px;
    left: 0; right: 0;
    height: 50px;
    z-index: 6;
    pointer-events: none;
    animation: flashOut 0.2s ease-out forwards;
  }
  .hit-flash.perfect { background: radial-gradient(ellipse at center bottom, rgba(0,255,136,0.25), transparent 70%); }
  .hit-flash.good { background: radial-gradient(ellipse at center bottom, rgba(232,232,232,0.15), transparent 70%); }
  .hit-flash.miss { background: radial-gradient(ellipse at center bottom, rgba(255,51,85,0.15), transparent 70%); }

  @keyframes flashOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  .judge-text {
    position: absolute;
    bottom: 150px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    z-index: 15;
    pointer-events: none;
    animation: judgeUp 0.4s ease-out forwards;
  }
  .judge-text.perfect { color: var(--accent); }
  .judge-text.good { color: var(--fg); }
  .judge-text.miss { color: var(--miss); }

  @keyframes judgeUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-25px); }
  }

  .bpm-label {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--dim);
    z-index: 10;
    pointer-events: none;
  }

  /* ---- RESULT ---- */
  .result-title {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    color: var(--dim);
    margin-bottom: 2em;
    text-transform: uppercase;
  }
  .result-score {
    font-size: 3.5rem;
    font-weight: 700;
    margin-bottom: 0.3em;
  }
  .result-grade {
    font-size: 1.2rem;
    letter-spacing: 0.3em;
    margin-bottom: 2em;
  }
  .result-grade.s { color: var(--accent); }
  .result-grade.a { color: #88ccff; }
  .result-grade.b { color: var(--fg); }
  .result-grade.c { color: var(--dim); }
  .result-stats {
    display: grid;
    grid-template-columns: auto auto;
    gap: 12px 36px;
    margin-bottom: 3em;
    font-size: 0.7rem;
  }
  .stat-label {
    color: var(--dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: right;
  }
  .stat-value { font-weight: 700; }
  .pf { color: var(--accent); }
  .ms { color: var(--miss); }
</style>
</head>
<body>

<!-- ============ TITLE ============ -->
<div id="title-screen" class="screen">
  <h1>PULSE</h1>
  <div class="subtitle">rhythm × haptics</div>
  <div class="song-select" id="song-select"></div>
  <button class="start-btn" id="start-btn">START</button>
  <div class="info-text">
    iOS 18 Safari でハプティクス対応<br>
    サウンドON推奨（マナーモード解除）
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game-screen" class="screen hidden">
  <div class="game-hud">
    <div>
      <div class="hud-score" id="hud-score">0</div>
      <div class="hud-combo" id="hud-combo">0 COMBO</div>
    </div>
    <div>
      <div class="hud-song" id="hud-song">PULSE</div>
      <div class="hud-progress"><div class="hud-progress-bar" id="hud-progress"></div></div>
    </div>
  </div>
  <div class="lane-container" id="lanes"></div>
  <div class="bpm-label" id="bpm-label">120 BPM</div>
</div>

<!-- ============ RESULT ============ -->
<div id="result-screen" class="screen hidden">
  <div class="result-title">RESULT</div>
  <div class="result-score" id="r-score">0</div>
  <div class="result-grade" id="r-grade">-</div>
  <div class="result-stats">
    <div class="stat-label">PERFECT</div><div class="stat-value pf" id="r-perfect">0</div>
    <div class="stat-label">GOOD</div><div class="stat-value" id="r-good">0</div>
    <div class="stat-label">MISS</div><div class="stat-value ms" id="r-miss">0</div>
    <div class="stat-label">MAX COMBO</div><div class="stat-value" id="r-combo">0</div>
  </div>
  <button class="start-btn" id="retry-btn">RETRY</button>
</div>

<script>
// ================================================================
// HAPTIC ENGINE
// ios-haptics pattern: create checkbox switch -> label click -> remove
// ================================================================
const Haptic = {
  fire() {
    try {
      const id = '_h' + Math.random().toString(36).slice(2, 8);
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.setAttribute('switch', '');
      cb.id = id;
      cb.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';

      const label = document.createElement('label');
      label.setAttribute('for', id);
      label.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';

      document.body.appendChild(cb);
      document.body.appendChild(label);

      label.click();

      // Also try navigator.vibrate for Android
      if (navigator.vibrate) {
        navigator.vibrate(30);
      }

      requestAnimationFrame(() => {
        cb.remove();
        label.remove();
      });
    } catch(e) {
      // Silently fail on unsupported devices
    }
  }
};

// ================================================================
// AUDIO ENGINE
// ================================================================
let audioCtx = null;
let masterGain = null;

function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    masterGain.connect(audioCtx.destination);
    // Play a silent buffer to unlock audio on iOS
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  } catch(e) {
    console.error('Audio init failed:', e);
  }
}

function playSound(type) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  try {
    if (type === 'perfect') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + 0.04);
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.13);
    } else if (type === 'good') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.09);
    } else if (type === 'miss') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.value = 110;
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.16);
    } else if (type === 'tick') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 220;
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.05);
    } else if (type === 'tick-hi') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 440;
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.05);
    }
  } catch(e) {}
}

// ================================================================
// SONG DATA
// ================================================================
const SONGS = {
  pulse: {
    name: 'PULSE', bpm: 120,
    notes: (() => {
      const n = [];
      for (let b = 0; b < 32; b++) {
        if (b % 2 === 0) n.push([b, 1]);
        if (b % 2 === 1) n.push([b, 2]);
        if (b % 4 === 0) n.push([b, 0]);
        if (b % 4 === 3) n.push([b, 3]);
        if (b % 8 === 6) { n.push([b, 0]); n.push([b, 3]); }
      }
      return n.sort((a, b) => a[0] - b[0]);
    })()
  },
  grid: {
    name: 'GRID', bpm: 140,
    notes: (() => {
      const n = [];
      for (let b = 0; b < 36; b++) {
        n.push([b, b % 4]);
        if (b % 2 === 0) n.push([b, (b + 2) % 4]);
        if (b % 4 === 0) { n.push([b, 0]); n.push([b, 3]); }
      }
      return n.sort((a, b) => a[0] - b[0]);
    })()
  },
  sine: {
    name: 'SINE', bpm: 100,
    notes: (() => {
      const n = [];
      for (let b = 0; b < 28; b++) {
        const lane = Math.round(1.5 + 1.5 * Math.sin(b * 0.4));
        n.push([b, lane]);
        if (b % 3 === 0) n.push([b, (lane + 2) % 4]);
      }
      return n.sort((a, b) => a[0] - b[0]);
    })()
  }
};

const LANE_COUNT = 4;
const HIT_Y = 110;
const PERFECT_MS = 60;
const GOOD_MS = 130;
const NOTE_SPEED = 450;

// ================================================================
// STATE
// ================================================================
let selectedSong = 'pulse';
let score = 0, combo = 0, maxCombo = 0;
let perfects = 0, goods = 0, misses = 0;
let notes = [];
let startTime = 0, songDuration = 0, beatMs = 0, lastBeat = -1;
let running = false, rafId = null;

// ================================================================
// DOM
// ================================================================
const $ = id => document.getElementById(id);
const screens = { title: $('title-screen'), game: $('game-screen'), result: $('result-screen') };
const lanesEl = $('lanes');

function showScreen(name) {
  Object.entries(screens).forEach(([k, el]) => el.classList.toggle('hidden', k !== name));
}

// Song buttons
const songSelectEl = $('song-select');
Object.keys(SONGS).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'song-btn' + (key === selectedSong ? ' selected' : '');
  btn.textContent = SONGS[key].name;
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    ensureAudio();
    selectedSong = key;
    document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    Haptic.fire();
    playSound('perfect');
  }, { passive: false });
  btn.addEventListener('click', () => {
    ensureAudio();
    selectedSong = key;
    document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
  songSelectEl.appendChild(btn);
});

// ================================================================
// LANES
// ================================================================
function setupLanes() {
  lanesEl.innerHTML = '';
  for (let i = 0; i < LANE_COUNT; i++) {
    const lane = document.createElement('div');
    lane.className = 'lane';

    const hitLine = document.createElement('div');
    hitLine.className = 'hit-zone-line';
    lane.appendChild(hitLine);

    const glow = document.createElement('div');
    glow.className = 'hit-zone-glow';
    lane.appendChild(glow);

    const tap = document.createElement('div');
    tap.className = 'tap-target';
    tap.dataset.lane = i;
    lane.appendChild(tap);

    lanesEl.appendChild(lane);
  }
}

// ================================================================
// EFFECTS
// ================================================================
function showEffect(laneIdx, type) {
  const lane = lanesEl.children[laneIdx];
  if (!lane) return;

  const flash = document.createElement('div');
  flash.className = 'hit-flash ' + type;
  lane.appendChild(flash);
  setTimeout(() => flash.remove(), 200);

  const txt = document.createElement('div');
  txt.className = 'judge-text ' + type;
  txt.textContent = type.toUpperCase();
  lane.appendChild(txt);
  setTimeout(() => txt.remove(), 400);
}

function updateHUD() {
  $('hud-score').textContent = Math.floor(score);
  const c = $('hud-combo');
  c.textContent = combo + ' COMBO';
  c.className = 'hud-combo' + (combo >= 5 ? ' active' : '');
}

// ================================================================
// GAME START
// ================================================================
function startGame() {
  const song = SONGS[selectedSong];
  score = 0; combo = 0; maxCombo = 0;
  perfects = 0; goods = 0; misses = 0;
  notes = []; lastBeat = -1;

  beatMs = 60000 / song.bpm;
  songDuration = (Math.max(...song.notes.map(n => n[0])) + 4) * beatMs;

  setupLanes();
  updateHUD();
  $('hud-song').textContent = song.name;
  $('bpm-label').textContent = song.bpm + ' BPM';
  showScreen('game');

  startTime = performance.now() + 1500;
  running = true;

  song.notes.forEach(([beat, lane]) => {
    const el = document.createElement('div');
    el.className = 'note';
    lanesEl.children[lane].appendChild(el);
    notes.push({ el, lane, targetTime: startTime + beat * beatMs, hit: false, missed: false });
  });

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(gameLoop);
}

// ================================================================
// GAME LOOP
// ================================================================
function gameLoop(now) {
  if (!running) return;

  const elapsed = now - startTime;
  $('hud-progress').style.width = Math.max(0, Math.min(100, elapsed / songDuration * 100)) + '%';

  // Metronome
  const curBeat = Math.floor(elapsed / beatMs);
  if (curBeat >= 0 && curBeat !== lastBeat) {
    lastBeat = curBeat;
    playSound(curBeat % 4 === 0 ? 'tick-hi' : 'tick');
  }

  // Update notes
  const screenH = window.innerHeight;
  const travelMs = (screenH - HIT_Y) / NOTE_SPEED * 1000;

  for (const note of notes) {
    if (note.hit || note.missed) continue;
    const timeUntil = note.targetTime - now;
    const bottomPx = HIT_Y + (timeUntil / travelMs) * (screenH - HIT_Y);

    if (bottomPx < -40) {
      note.missed = true;
      note.el.style.display = 'none';
      misses++; combo = 0;
      showEffect(note.lane, 'miss');
      updateHUD();
      continue;
    }
    note.el.style.bottom = bottomPx + 'px';
  }

  if (elapsed > songDuration + 1500) { endGame(); return; }
  rafId = requestAnimationFrame(gameLoop);
}

// ================================================================
// TAP HANDLING
// ================================================================
function handleTap(laneIdx, now) {
  let best = null, bestDiff = Infinity;
  for (const note of notes) {
    if (note.hit || note.missed || note.lane !== laneIdx) continue;
    const diff = Math.abs(note.targetTime - now);
    if (diff < bestDiff) { bestDiff = diff; best = note; }
  }
  if (!best || bestDiff > GOOD_MS * 1.5) return;

  best.hit = true;
  best.el.style.display = 'none';

  let type;
  if (bestDiff <= PERFECT_MS) {
    type = 'perfect'; perfects++;
    score += 100 * (1 + combo * 0.02); combo++;
  } else if (bestDiff <= GOOD_MS) {
    type = 'good'; goods++;
    score += 50 * (1 + combo * 0.01); combo++;
  } else {
    type = 'miss'; misses++; combo = 0;
  }
  if (combo > maxCombo) maxCombo = combo;

  showEffect(laneIdx, type);
  playSound(type);
  updateHUD();

  // HAPTIC - directly in touchstart chain!
  if (type !== 'miss') Haptic.fire();
}

// ================================================================
// EVENTS
// ================================================================
lanesEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const now = performance.now();
  for (const touch of e.changedTouches) {
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (!el) continue;
    const target = el.closest('.tap-target');
    if (target) {
      handleTap(parseInt(target.dataset.lane), now);
    }
  }
}, { passive: false });

lanesEl.addEventListener('mousedown', (e) => {
  const target = e.target.closest('.tap-target');
  if (target) handleTap(parseInt(target.dataset.lane), performance.now());
});

document.addEventListener('touchend', (e) => {
  if (running) e.preventDefault();
}, { passive: false });

// ================================================================
// END GAME
// ================================================================
function endGame() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);

  const total = perfects + goods + misses;
  const acc = total > 0 ? (perfects + goods * 0.5) / total : 0;
  let grade, cls;
  if (acc >= 0.95 && misses === 0) { grade = 'S'; cls = 's'; }
  else if (acc >= 0.85) { grade = 'A'; cls = 'a'; }
  else if (acc >= 0.7) { grade = 'B'; cls = 'b'; }
  else { grade = 'C'; cls = 'c'; }

  $('r-score').textContent = Math.floor(score);
  const g = $('r-grade');
  g.textContent = 'GRADE ' + grade;
  g.className = 'result-grade ' + cls;
  $('r-perfect').textContent = perfects;
  $('r-good').textContent = goods;
  $('r-miss').textContent = misses;
  $('r-combo').textContent = maxCombo;
  showScreen('result');
}

// ================================================================
// BUTTONS
// ================================================================
$('start-btn').addEventListener('touchstart', (e) => {
  e.preventDefault();
  ensureAudio();
  Haptic.fire();
  startGame();
}, { passive: false });
$('start-btn').addEventListener('click', () => { ensureAudio(); startGame(); });

$('retry-btn').addEventListener('touchstart', (e) => {
  e.preventDefault();
  ensureAudio();
  Haptic.fire();
  startGame();
}, { passive: false });
$('retry-btn').addEventListener('click', () => { ensureAudio(); startGame(); });
</script>
</body>
</html>
