    <style>
        body {

            position: fixed;

        #gameCanvas {
            border: 2px solid #00f2fe;
            background: linear-gradient(180deg, #0a0f1d 0%, #1a2235 100%);

        #opening {
            position: absolute;

        .icon2 { top: 25%; right: 12%; animation-delay: 2s; }
        .icon3 { bottom: 25%; left: 15%; animation-delay: 4s; }
        .icon4 { bottom: 15%; right: 8%; animation-delay: 6s; }
        
        #ui {

            top: 60px; /* ナビゲーションの下に配置 */
            left: 10px;

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const containerWidth = window.innerWidth;
            if(containerWidth < 375) {
                canvas.style.width = '100%';
                canvas.style.height = '100vh';
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = {
            player: { x: 187.5, y: 550, health: 100, walkCycle: 0, character: 'male' },
            score: 10000000,
            time: 0,
            gameRunning: true,
            bullets: [],
            enemies: [],
            powerups: [],
            particles: [],
            floatingTexts: [],
            boss: null,
            bossSpawned: false,
            gameCleared: false
        };
        
        let selectedCharacter = 'male';
        let gameStarted = false;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let powerupSpawnTimer = 0;
        let mouseX = 187.5, mouseY = 400;
        let isShooting = false;

        const hapticState = {
            enabled: true,
            lastHitAt: 0,
            lastTouchAt: 0,
            lastPickupAt: 0,
            lastCelebrationAt: 0,
            iosTimerIds: []
        };

        function setupHaptics() {
            // no-op: iOS Safari fallback creates ephemeral switch elements on demand
        }

        function isProbablyIOSSafari() {
            const ua = navigator.userAgent || '';
            const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isWebKit = /WebKit/.test(ua);
            const isExcluded = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
            return isIOS && isWebKit && !isExcluded;
        }

        function supportsVibrateAPI() {
            return typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';
        }

        function clearIosHapticTimers() {
            hapticState.iosTimerIds.forEach(id => clearTimeout(id));
            hapticState.iosTimerIds = [];
        }

        function primeHaptics() {
            // Intentionally empty. iOS Safari uses per-trigger ephemeral switches.
        }

        function triggerIOSHapticTap() {
            if (!hapticState.enabled || !isProbablyIOSSafari()) return;

            const host = document.createElement('div');
            host.setAttribute('aria-hidden', 'true');
            host.style.position = 'fixed';
            host.style.left = '-9999px';
            host.style.top = '-9999px';
            host.style.width = '1px';
            host.style.height = '1px';
            host.style.overflow = 'hidden';
            host.style.opacity = '0.001';

            const input = document.createElement('input');
            const id = `iosHapticSwitch-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            input.type = 'checkbox';
            input.setAttribute('switch', '');
            input.id = id;

            const label = document.createElement('label');
            label.htmlFor = id;
            label.textContent = 'Haptic';

            host.appendChild(label);
            host.appendChild(input);
            document.body.appendChild(host);

            try {
                label.click();
            } catch (error) {
                // ignore
            }

            setTimeout(() => host.remove(), 120);
        }

        function scheduleIOSHapticTaps(pattern) {
            clearIosHapticTimers();
            let delay = 0;
            pattern.forEach((entry, index) => {
                const duration = typeof entry === 'number' ? entry : 0;
                if (index % 2 === 0 && duration > 0) {
                    hapticState.iosTimerIds.push(setTimeout(triggerIOSHapticTap, delay));
                }
                delay += Math.max(duration, 16);
            });
        }

        function vibratePattern(pattern) {
            if (!hapticState.enabled) return;
            if (supportsVibrateAPI()) {
                try {
                    navigator.vibrate?.(pattern);
                } catch (error) {
                    // ignore and fall through
                }
                return;
            }
            if (isProbablyIOSSafari()) {
                if (Array.isArray(pattern)) scheduleIOSHapticTaps(pattern);
                else triggerIOSHapticTap();
            }
        }

        setupHaptics();

        function triggerHaptic(eventType) {
            const now = performance.now();
            switch (eventType) {
                case 'pickup_subscriber':
                    if (now - hapticState.lastPickupAt < 90) return;
                    hapticState.lastPickupAt = now;
                    vibratePattern(30);
                    break;
                case 'pickup_bonus':
                    if (now - hapticState.lastPickupAt < 120) return;
                    hapticState.lastPickupAt = now;
                    vibratePattern([20, 30, 20]);
                    break;
                case 'hit_normal':
                    if (now - hapticState.lastHitAt < 120) return;
                    hapticState.lastHitAt = now;
                    vibratePattern(60);
                    break;
                case 'hit_heavy':
                    if (now - hapticState.lastHitAt < 180) return;
                    hapticState.lastHitAt = now;
                    vibratePattern([80, 50, 100]);
                    break;
                case 'touch_boss':
                    if (now - hapticState.lastTouchAt < 160) return;
                    hapticState.lastTouchAt = now;
                    vibratePattern(30);
                    break;
                case 'boss_down':
                    if (now - hapticState.lastCelebrationAt < 500) return;
                    hapticState.lastCelebrationAt = now;
                    vibratePattern([40, 25, 40, 25, 70]);
                    break;
                case 'game_over':
                    vibratePattern(isProbablyIOSSafari() ? [40, 80, 40] : 180);
                    break;
            }
        }
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
        });
        canvas.addEventListener('mousedown', () => { primeHaptics(); isShooting = true; });
        canvas.addEventListener('mouseup', () => isShooting = false);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.touches[0].clientX - rect.left) * scaleX;
            mouseY = (e.touches[0].clientY - rect.top) * scaleY;
        });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); primeHaptics(); isShooting = true; });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); isShooting = false; });
        
        function createFloatingText(x, y, text, color, isEmoji = false) {
            gameState.floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                alpha: 1,
                life: 45,
                vy: -3,
                isEmoji: isEmoji
            });
        }

        function drawPlayer(x, y, walkCycle, character) {
            if (character === 'male') drawMalePlayer(x, y, walkCycle);
            else if (character === 'female') drawFemalePlayer(x, y, walkCycle);
            else drawAlienPlayer(x, y, walkCycle);
        }
        
        function drawMalePlayer(x, y, walkCycle) {
            ctx.save();
            const legOffset = Math.sin(walkCycle * 0.4) * 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(x, y + 15, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0a0f1d'; ctx.fillRect(x - 6, y - 5, 4, 18); ctx.fillRect(x + 2, y - 5 - legOffset, 4, 18 + legOffset);
            ctx.fillStyle = '#4a5568'; ctx.beginPath(); ctx.moveTo(x - 12, y - 30); ctx.lineTo(x + 12, y - 30); ctx.lineTo(x + 16, y + 5); ctx.lineTo(x - 16, y + 5); ctx.fill();
            ctx.fillStyle = '#0a0f1d'; ctx.beginPath(); ctx.moveTo(x-4, y-30); ctx.lineTo(x, y-20); ctx.lineTo(x+4, y-30); ctx.fill();
            ctx.fillStyle = '#fe0979'; ctx.fillRect(x - 1, y - 28, 2, 12);
            ctx.fillStyle = '#ffd1a9'; ctx.beginPath(); ctx.arc(x, y - 32, 8, 0, Math.PI); ctx.fill();
            ctx.fillStyle = '#2d3748'; ctx.beginPath(); ctx.arc(x, y - 35, 9, Math.PI, 0); ctx.fill(); ctx.fillRect(x - 14, y - 36, 28, 3);
            ctx.fillStyle = '#1a202c'; ctx.fillRect(x - 8, y - 33, 16, 5);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 3, y - 28); ctx.lineTo(x + 10, y - 27); ctx.stroke();
            ctx.fillStyle = '#fe0979'; ctx.fillRect(x + 10, y - 28, 2, 2);
            ctx.fillStyle = '#2d3748'; ctx.beginPath(); ctx.moveTo(x - 8, y - 25); ctx.lineTo(x + 12, y - 18); ctx.lineTo(x + 8, y - 12); ctx.lineTo(x - 10, y - 18); ctx.fill();
            ctx.fillStyle = '#00f2fe'; ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.moveTo(x + 12, y - 16); ctx.lineTo(x + 22, y - 14); ctx.lineTo(x + 12, y - 12); ctx.fill(); ctx.shadowBlur = 0;
            ctx.restore();
        }
        
        function drawFemalePlayer(x, y, walkCycle) {
            ctx.save();
            const legOffset = Math.sin(walkCycle * 0.4) * 4;
            
            // 影
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; 
            ctx.beginPath(); 
            ctx.ellipse(x, y + 15, 12, 4, 0, 0, Math.PI * 2); 
            ctx.fill();
            
            // 足（パンツスーツ）
            ctx.fillStyle = '#2d3748'; // ダークグレー
            ctx.fillRect(x - 6, y - 5, 4, 18); 
            ctx.fillRect(x + 2, y - 5 - legOffset, 4, 18 + legOffset);
            
            // 靴
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(x - 6, y + 10, 5, 3); 
            ctx.fillRect(x + 2, y + 10 - legOffset, 5, 3);
            
            // スーツジャケット（紺色）
            ctx.fillStyle = '#1e3a8a'; // 紺色
            ctx.beginPath(); 
            ctx.moveTo(x - 10, y - 28); 
            ctx.lineTo(x + 10, y - 28); 
            ctx.lineTo(x + 8, y + 2); 
            ctx.lineTo(x - 8, y + 2); 
            ctx.fill();
            
            // ブラウス（白）
            ctx.fillStyle = '#f8f9fa';
            ctx.beginPath();
            ctx.moveTo(x - 4, y - 28);
            ctx.lineTo(x + 4, y - 28);

            // 顔

            // 髪（ショートヘア - 茶色）
            ctx.fillStyle = '#6b4423';
            ctx.beginPath();

            ctx.fill(); 
            ctx.fillRect(x - 9, y - 36, 18, 3);
            
            // 前髪
            ctx.beginPath();
            ctx.moveTo(x - 8, y - 36);
            ctx.lineTo(x - 6, y - 30);
            ctx.lineTo(x - 3, y - 33);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + 8, y - 36);
            ctx.lineTo(x + 6, y - 30);
            ctx.lineTo(x + 3, y - 33);
            ctx.fill();
            
            // 目
            ctx.fillStyle = '#2d3748';
            ctx.beginPath();
            ctx.arc(x - 3, y - 33, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 3, y - 33, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // 口（微笑み）
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y - 30, 3, 0, Math.PI);
            ctx.stroke();
            
            // ノート（持ち物）
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#cbd5e0';
            ctx.lineWidth = 1;
            ctx.fillRect(x - 8, y - 20, 7, 10);
            ctx.strokeRect(x - 8, y - 20, 7, 10);
            
            // ノートの線
            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 0.5;
            for(let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(x - 7, y - 17 + i * 3);
                ctx.lineTo(x - 2, y - 17 + i * 3);
                ctx.stroke();
            }
            
            // 鉛筆（武器）
            ctx.save();
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(x + 12, y - 17, 2, 8);
            ctx.beginPath();
            ctx.moveTo(x + 13, y - 17);
            ctx.lineTo(x + 10, y - 20);
            ctx.lineTo(x + 16, y - 20);

            ctx.restore();

        function drawAlienPlayer(x, y, walkCycle) {
            ctx.save();
            const pulse = Math.sin(Date.now() * 0.005) * 2;
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = 'rgba(0, 242, 254, 0.1)'; ctx.beginPath(); ctx.ellipse(x, y + 15, 15, 4, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(0, 242, 254, 0.6)'; ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, y - 35 + pulse); ctx.lineTo(x + 12, y - 10); ctx.lineTo(x, y + 5); ctx.lineTo(x - 12, y - 10); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 15;
            ctx.beginPath(); ctx.arc(x, y - 15, 4, 0, Math.PI*2); ctx.fill();
            for(let i=0; i<3; i++) { ctx.beginPath(); ctx.ellipse(x, y - 25 + i*10, 14 - i*2, 3, 0, 0, Math.PI*2); ctx.stroke(); }
            ctx.fillStyle = '#fe0979'; ctx.shadowColor = '#fe0979'; ctx.beginPath(); ctx.arc(x + 18, y - 15, 3, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawBullet(bullet) {
            ctx.save();
            ctx.font = '18px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // キャラクターごとに異なる武器
            if (bullet.character === 'male') {
                // ハードボイルド: 黒ペン
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 8;
                ctx.fillText('🖊️', bullet.x, bullet.y);
            } else if (bullet.character === 'female') {
                // 女性会社員: 黄色い鉛筆
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.fillText('✏️', bullet.x, bullet.y);
            } else {
                // ホログラム: 虹色ペン（仮）
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 10;
                ctx.fillText('🖊️', bullet.x, bullet.y);
            }
            
            ctx.restore();
        }

        function drawBoss(boss) {
            ctx.save();
            const bX = boss.x, bY = boss.y;
            
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; 
            ctx.beginPath(); ctx.ellipse(bX, bY + 30, 35, 8, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#c0b298';
            ctx.beginPath(); ctx.ellipse(bX, bY - 10, 35, 30, 0, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.ellipse(bX, bY + 15, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#e8e8e8';
            ctx.beginPath(); ctx.moveTo(bX-12, bY-35); ctx.lineTo(bX, bY+10); ctx.lineTo(bX+12, bY-35); ctx.fill();
            
            ctx.fillStyle = '#8b0000';
            ctx.beginPath(); ctx.moveTo(bX-4, bY-30); ctx.lineTo(bX-10, bY+5); ctx.lineTo(bX-4, bY+8); ctx.lineTo(bX+2, bY-30); ctx.fill();

            ctx.fillStyle = '#f5cba7';
            ctx.beginPath(); ctx.arc(bX - 32, bY + 5, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bX + 32, bY + 5, 8, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#f5cba7';
            ctx.beginPath(); ctx.arc(bX, bY - 45, 22, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
            ctx.beginPath(); ctx.arc(bX - 12, bY - 42, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bX + 12, bY - 42, 6, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = 'rgba(50, 80, 100, 0.3)';
            ctx.beginPath(); ctx.arc(bX, bY - 34, 12, 0, Math.PI); ctx.fill();

            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 7; i++) {
                ctx.beginPath();
                ctx.moveTo(bX - 12 + i * 4, bY - 67);
                ctx.lineTo(bX - 10 + i * 4, bY - 58);
                ctx.stroke();
            }

            ctx.fillStyle = '#444';
            ctx.beginPath(); ctx.arc(bX - 22, bY - 45, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bX + 22, bY - 45, 4, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#fe0979'; 
            ctx.shadowColor = '#fe0979'; ctx.shadowBlur = 10;
            ctx.fillRect(bX - 22, bY - 58, 44, 8);
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.moveTo(bX-20, bY-54); ctx.lineTo(bX-32, bY-40); ctx.lineTo(bX-22, bY-45); ctx.fill();

            ctx.strokeStyle = '#111';
            ctx.lineWidth = 2;
            ctx.strokeRect(bX - 16, bY - 50, 12, 8);
            ctx.strokeRect(bX + 4, bY - 50, 12, 8);
            ctx.beginPath(); ctx.moveTo(bX - 4, bY - 46); ctx.lineTo(bX + 4, bY - 46); ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(bX - 15, bY - 49, 10, 6);
            ctx.fillRect(bX + 5, bY - 49, 10, 6);
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(bX - 10, bY - 46, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bX + 10, bY - 46, 2, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(bX - 30, bY - 85, 60, 6);
            ctx.fillStyle = '#fe0979'; ctx.fillRect(bX - 29, bY - 84, 58, 4);
            ctx.fillStyle = '#00f2fe'; ctx.fillRect(bX - 29, bY - 84, (boss.health/boss.maxHealth)*58, 4);
            
            ctx.restore();
        }

        function drawEnemy(enemy) {
            ctx.font = enemy.type === 'smartphone' ? '30px Arial' : '36px Arial';
            ctx.fillText(enemy.type === 'smartphone' ? '📱' : '💻', enemy.x-15, enemy.y+10);
        }
        function drawPowerup(powerup) {
            if (powerup.type === 'subscriber') {
                ctx.font = '28px Arial';
                ctx.fillText('📰', powerup.x-12, powerup.y+8);
            } else {
                // ボーナス（💰）を光らせる
                ctx.save();

                ctx.shadowBlur = 15;

            }
        }

        // ★ ボスの攻撃色を逆転（パワハラ＝青、セクハラ＝ピンク）
        function drawBossBullet(enemy) {
            ctx.save();
            const pulseTime = Date.now() * 0.003;
            
            if (enemy.bulletType === 'power_harassment') {
                const powerTexts = ['やる気あんの？', 'そんなんで給料もらえると思ってんの？', '使えねえな'];
                if (!enemy.harassmentText) enemy.harassmentText = powerTexts[Math.floor(Math.random() * powerTexts.length)];
                
                const spikes = 12;
                const baseRadius = 25;
                const spikeLength = 8 + Math.sin(pulseTime * 3) * 4;
                
                // パワハラは青（サイバーブルー）
                const glowGradient = ctx.createRadialGradient(enemy.x, enemy.y, 0, enemy.x, enemy.y, baseRadius + spikeLength + 10);
                glowGradient.addColorStop(0, 'rgba(0, 242, 254, 0.8)');
                glowGradient.addColorStop(1, 'rgba(0, 242, 254, 0)');
                ctx.fillStyle = glowGradient;
                ctx.beginPath(); ctx.arc(enemy.x, enemy.y, baseRadius + spikeLength + 10, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = '#00f2fe';
                ctx.beginPath();
                for (let i = 0; i < spikes; i++) {
                    const angle = (Math.PI * 2 * i) / spikes;
                    const nextAngle = (Math.PI * 2 * (i + 1)) / spikes;
                    ctx.lineTo(enemy.x + Math.cos(angle) * (baseRadius + spikeLength), enemy.y + Math.sin(angle) * (baseRadius + spikeLength));
                    ctx.lineTo(enemy.x + Math.cos(nextAngle) * baseRadius, enemy.y + Math.sin(nextAngle) * baseRadius);
                }
                ctx.closePath(); ctx.fill();
                
                const centerGradient = ctx.createRadialGradient(enemy.x, enemy.y, 0, enemy.x, enemy.y, baseRadius);
                centerGradient.addColorStop(0, '#4facfe');
                centerGradient.addColorStop(1, '#005bea');
                ctx.fillStyle = centerGradient;
                ctx.beginPath(); ctx.arc(enemy.x, enemy.y, baseRadius, 0, Math.PI * 2); ctx.fill();
                
                if (Math.random() < 0.3) {
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
                    const angle = Math.random() * Math.PI * 2;
                    ctx.moveTo(enemy.x + Math.cos(angle)*baseRadius, enemy.y + Math.sin(angle)*baseRadius);
                    ctx.lineTo(enemy.x + Math.cos(angle)*40, enemy.y + Math.sin(angle)*40);
                    ctx.stroke();
                }
                
                ctx.font = 'bold 12px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.strokeText(enemy.harassmentText, enemy.x, enemy.y + 4);
                ctx.fillStyle = '#fff';
                ctx.fillText(enemy.harassmentText, enemy.x, enemy.y + 4);
                
            } else {
                const sexualTexts = ['かわいいね', '彼氏いるの？', '飲みいこうよ'];
                if (!enemy.harassmentText) enemy.harassmentText = sexualTexts[Math.floor(Math.random() * sexualTexts.length)];
                
                const scale = 1 + Math.sin(pulseTime * 4) * 0.15;
                const rotation = pulseTime * 2;
                
                ctx.translate(enemy.x, enemy.y);
                ctx.rotate(rotation);
                ctx.scale(scale, scale);
                
                // セクハラはピンク
                const glowGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 45);
                glowGradient.addColorStop(0, 'rgba(254, 9, 121, 0.8)');
                glowGradient.addColorStop(1, 'rgba(254, 9, 121, 0)');
                ctx.fillStyle = glowGradient;
                ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.fill();
                
                const heartSize = 20;
                const heartGradient = ctx.createLinearGradient(0, -heartSize, 0, heartSize);
                heartGradient.addColorStop(0, '#ff4b91');
                heartGradient.addColorStop(1, '#fe0979');
                ctx.fillStyle = heartGradient;
                
                ctx.beginPath();
                ctx.moveTo(0, heartSize * 0.3);
                ctx.bezierCurveTo(-heartSize * 0.5, -heartSize * 0.3, -heartSize, heartSize * 0.1, 0, heartSize);
                ctx.bezierCurveTo(heartSize, heartSize * 0.1, heartSize * 0.5, -heartSize * 0.3, 0, heartSize * 0.3);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                
                if (Math.random() < 0.4) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc((Math.random()-0.5)*30, (Math.random()-0.5)*30, 2, 0, Math.PI*2); ctx.fill();
                }
                
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                
                ctx.font = 'bold 12px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.strokeText(enemy.harassmentText, enemy.x, enemy.y + 35);
                ctx.fillStyle = '#fff';
                ctx.fillText(enemy.harassmentText, enemy.x, enemy.y + 35);
            }
            ctx.restore();
        }

        function drawParticle(p) {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        }

        function spawnEnemy() {
            const type = Math.random() < 0.7 ? 'smartphone' : 'tablet';
            gameState.enemies.push({ x: Math.random()*(canvas.width-60)+30, y: -30, type, health: type==='tablet'?3:1, speed: type==='smartphone'?2.5:1.5 });
        }

        function spawnPowerup() {
            const type = Math.random() < 0.8 ? 'subscriber' : 'dollar';
            gameState.powerups.push({ x: Math.random()*(canvas.width-40)+20, y: -20, type, speed: type==='subscriber'?4:2 });
        }

        function shootBullet() {
            gameState.bullets.push({ x: gameState.player.x, y: gameState.player.y - 20, speed: 10, character: gameState.player.character });
        }

        function createParticles(x, y, color, count=6) {
            for(let i=0; i<count; i++) gameState.particles.push({ x: x+(Math.random()-0.5)*15, y: y+(Math.random()-0.5)*15, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, size: Math.random()*3+1, color, alpha: 1, life: 30 });
        }

        function checkCollision(o1, o2, r1=12, r2=12) {
            return Math.hypot(o1.x - o2.x, o1.y - o2.y) < r1 + r2;
        }

        function selectCharacter(c) {
            selectedCharacter = c;
            document.querySelectorAll('.character-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-character="${c}"]`).classList.add('selected');
        }

        function startGame() {
            gameState.player.character = selectedCharacter;
            gameStarted = true;
            document.getElementById('opening').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('ui').style.display = 'flex';
            document.getElementById('instructions').style.display = 'block';
            primeHaptics();
        }

        function updateGame(deltaTime) {
            if (!gameState.gameRunning || !gameStarted) return;
            
            gameState.time += deltaTime / 1000;
            gameState.player.walkCycle += deltaTime * 0.01;
            
            const dx = mouseX - gameState.player.x, dy = Math.min(mouseY, canvas.height-50) - gameState.player.y;
            if (Math.abs(dx)>5) gameState.player.x += dx>0 ? 6 : -6;
            if (Math.abs(dy)>5) gameState.player.y += dy>0 ? 6 : -6;
            gameState.player.x = Math.max(20, Math.min(canvas.width-20, gameState.player.x));
            gameState.player.y = Math.max(50, Math.min(canvas.height-20, gameState.player.y));
            
            if (isShooting && Math.random() < 0.25) shootBullet();
            
            if (!gameState.bossSpawned && gameState.time > 30) {
                gameState.boss = { x: canvas.width/2, y: 160, health: 120, maxHealth: 120, moveDir: 1, shootTimer: 0 };
                gameState.bossSpawned = true;
            }
            
            // 敵の出現（ボス戦中は出現頻度を落とす）
            enemySpawnTimer += deltaTime;
            if (!gameState.bossSpawned) {
                if (enemySpawnTimer > Math.max(400 - gameState.time*8, 150)) { spawnEnemy(); enemySpawnTimer = 0; }
            } else {
                // ボス戦中も敵が出現するが、頻度は半分に
                if (enemySpawnTimer > 1200) { spawnEnemy(); enemySpawnTimer = 0; }
            }
            
            powerupSpawnTimer += deltaTime;
            if (powerupSpawnTimer > 5000) { spawnPowerup(); powerupSpawnTimer = 0; }
            
            gameState.bullets = gameState.bullets.filter(b => { b.y -= b.speed; return b.y > -10; });
            
            if (gameState.boss) {
                const b = gameState.boss;
                b.x += b.moveDir * 2.5;
                if (b.x < 50 || b.x > canvas.width-50) b.moveDir *= -1;
                
                b.shootTimer += deltaTime;
                if (b.shootTimer > 800) {
                    const angle = Math.atan2(gameState.player.y - b.y, gameState.player.x - b.x);
                    gameState.enemies.push({ 
                        x: b.x, y: b.y+20, type: 'boss_bullet', 
                        bulletType: Math.random() < 0.5 ? 'power_harassment' : 'sexual_harassment', 
                        vx: Math.cos(angle)*3.5, vy: Math.sin(angle)*3.5 
                    });
                    b.shootTimer = 0;
                }
                if (checkCollision(gameState.player, b, 12, 35)) { gameState.player.health -= 1; createParticles(b.x, b.y, '#fe0979'); triggerHaptic('touch_boss'); }
            }
            
            gameState.enemies = gameState.enemies.filter(e => {
                if (e.type === 'boss_bullet') {
                    e.x += e.vx; e.y += e.vy;
                    if (checkCollision(gameState.player, e, 12, 20)) { 
                        gameState.player.health -= 15; 
                        // ★ パーティクル色も逆転
                        createParticles(e.x, e.y, e.bulletType === 'power_harassment' ? '#00f2fe' : '#fe0979'); 
                        triggerHaptic('hit_heavy');
                        return false; 
                    }
                    return e.y < canvas.height+30 && e.x > -30 && e.x < canvas.width+30;
                } else {
                    e.y += e.speed;
                    if (checkCollision(gameState.player, e, 12, 15)) { gameState.player.health -= 10; gameState.score = Math.max(0, gameState.score-80000); createParticles(e.x, e.y, '#fe0979'); triggerHaptic('hit_normal'); return false; }
                    return e.y < canvas.height+20;
                }
            });
            
            gameState.powerups = gameState.powerups.filter(p => {
                p.y += p.speed;
                if (checkCollision(gameState.player, p, 12, 12)) {
                    if (p.type === 'subscriber') { 
                        gameState.score += 1500000; 
                        createParticles(p.x, p.y, '#00f2fe'); 
                        createFloatingText(p.x, p.y, '📰', '#00f2fe', true);
                        createFloatingText(p.x, p.y + 15, 'CIRCULATION UP!', '#00f2fe', false);
                        triggerHaptic('pickup_subscriber');
                    } else { 
                        gameState.player.health = Math.min(100, gameState.player.health+15); 
                        createParticles(p.x, p.y, '#ffd700');
                        createFloatingText(p.x, p.y, '💰', '#ffd700', true);
                        createFloatingText(p.x, p.y + 15, 'MOTIVATION UP!', '#ffd700', false);
                        triggerHaptic('pickup_bonus');
                    }
                    return false;
                }
                return p.y < canvas.height+20;
            });
            
            gameState.bullets.forEach((b, bIdx) => {
                gameState.enemies.forEach((e, eIdx) => {
                    if (e.type !== 'boss_bullet' && checkCollision(b, e, 4, 15)) {
                        e.health--; gameState.bullets.splice(bIdx, 1);
                        if (e.health <= 0) { gameState.score += 20000; createParticles(e.x, e.y, '#00f2fe'); gameState.enemies.splice(eIdx, 1); }
                    }
                });
                if (gameState.boss && checkCollision(b, gameState.boss, 4, 30)) {
                    gameState.boss.health -= 0.7; gameState.bullets.splice(bIdx, 1); createParticles(gameState.boss.x, gameState.boss.y, '#00f2fe');
                    if (gameState.boss.health <= 0) { showGameClear(); }
                }
            });
            
            gameState.particles = gameState.particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.life--; p.alpha=p.life/30; return p.life>0; });
            
            gameState.floatingTexts = gameState.floatingTexts.filter(ft => {
                ft.y += ft.vy;
                ft.life--;
                if (ft.isEmoji) {
                    ft.vy += 0.2;
                } else {
                    ft.alpha = ft.life / 45;
                }
                return ft.life > 0;
            });

            gameState.score = Math.max(0, gameState.score - deltaTime*200);
            
            if (gameState.player.health <= 0 || gameState.score <= 0) endGame();
        }

        function render() {
            if (!gameStarted) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.05)'; ctx.lineWidth = 1;
            const scroll = (gameState.time * 40) % 40;
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i+scroll); ctx.lineTo(canvas.width, i+scroll); ctx.stroke(); }
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }

            drawPlayer(gameState.player.x, gameState.player.y, gameState.player.walkCycle, gameState.player.character);
            gameState.bullets.forEach(drawBullet);
            if (gameState.boss) drawBoss(gameState.boss);
            gameState.enemies.forEach(e => e.type==='boss_bullet'?drawBossBullet(e):drawEnemy(e));
            gameState.powerups.forEach(drawPowerup);
            gameState.particles.forEach(drawParticle);
            
            gameState.floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.textAlign = 'center';
                if (ft.isEmoji) {
                    ctx.font = '28px Arial';
                    ctx.fillText(ft.text, ft.x, ft.y);
                } else {
                    ctx.font = 'bold 15px "Segoe UI", sans-serif';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 4;
                    ctx.strokeText(ft.text, ft.x, ft.y); 
                    ctx.fillStyle = ft.color;
                    ctx.shadowColor = ft.color;
                    ctx.shadowBlur = 8;
                    ctx.fillText(ft.text, ft.x, ft.y);
                }
                ctx.restore();
            });
            
            document.getElementById('score').textContent = Math.floor(gameState.score).toLocaleString();
            document.getElementById('health').textContent = Math.max(0, Math.floor(gameState.player.health));
            document.getElementById('time').textContent = Math.floor(gameState.time);
        }

        function showGameClear() {
            gameState.gameRunning = false;
            triggerHaptic('boss_down');
            document.getElementById('gameOverTitle').innerHTML = '🎉 YOU ARE FIRED! 🎉';
            document.getElementById('gameOverTitle').style.color = '#00f2fe';
            document.getElementById('gameOverTitle').style.textShadow = '0 0 10px rgba(0,242,254,0.5)';
            document.getElementById('finalMessage').innerHTML = '上司を倒してスッキリしました！<br>もう新聞業界とはおさらばです';
            document.getElementById('finalScore').textContent = Math.floor(gameState.score).toLocaleString();
            document.getElementById('finalTime').textContent = Math.floor(gameState.time);
            document.getElementById('gameOver').style.display = 'block';
        }

        function endGame() {
            gameState.gameRunning = false;
            triggerHaptic('game_over');
            let titleText = '';
            let message = '';
            
            if (gameState.score <= 0) {
                titleText = '💀 新聞社倒産 💀';
                message = '📉 発行部数がゼロになりました...<br>デジタル化の波に完全に飲まれてしまいました';
            } else {
                titleText = '😔 依願退職 😔';
                message = '😵 記者のやる気が完全に失われました...<br>過労で自ら退職してしまいました';
            }
            
            document.getElementById('gameOverTitle').innerHTML = titleText;
            document.getElementById('gameOverTitle').style.color = '#fe0979';
            document.getElementById('gameOverTitle').style.textShadow = '0 0 10px rgba(254,9,121,0.5)';
            document.getElementById('finalMessage').innerHTML = message;
            document.getElementById('finalScore').textContent = Math.floor(gameState.score).toLocaleString();
            document.getElementById('finalTime').textContent = Math.floor(gameState.time);
            document.getElementById('gameOver').style.display = 'block';
        }

        function returnToTitle() {
            clearIosHapticTimers();
            gameState = { player: { x: 187.5, y: 550, health: 100, walkCycle: 0, character: selectedCharacter }, score: 10000000, time: 0, gameRunning: true, bullets: [], enemies: [], powerups: [], particles: [], floatingTexts: [], boss: null, bossSpawned: false, gameCleared: false };
            gameStarted = false; enemySpawnTimer = 0; powerupSpawnTimer = 0;
            document.getElementById('gameOver').style.display = 'none'; 
            document.getElementById('gameCanvas').style.display = 'none'; 
            document.getElementById('ui').style.display = 'none'; 
            document.getElementById('instructions').style.display = 'none'; 
            document.getElementById('opening').style.display = 'flex';
        }

        function gameLoop(t) {
            updateGame(t - lastTime); render(); lastTime = t; requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
