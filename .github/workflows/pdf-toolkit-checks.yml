name: PDF Toolkit checks

on:
  push:
    paths:
      - 'apps/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pdf-toolkit-checks.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pdf-toolkit-checks.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:standalone
      - name: Commit regenerated standalone builds
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain apps/pdf-toolkit-standalone.html apps/pdf-toolkit-standalone-en.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/pdf-toolkit-standalone.html apps/pdf-toolkit-standalone-en.html
            git commit -m "Regenerate standalone PDF Toolkit builds"
            git push
          fi
      - run: pnpm run check:pdf-toolkit
