  </g>

  <!-- 値ラベル -->
  <text class="lab acc" x="76.0" y="176.8" text-anchor="end">54.5%</text>
  <text class="lab gry" x="76.0" y="298.2" text-anchor="end">12.0%</text>
  <text class="lab acc" x="648.0" y="204.8">44.7%</text>
  <text class="lab gry" x="648.0" y="289.6">15.0%</text>
  <text class="lab acc halo" x="255.1" y="137.7" text-anchor="middle">63.1%（1997年）</text>

  <!-- 倍率 -->
  <line x1="84.0" y1="179.3" x2="84.0" y2="286.7" stroke="#2563eb" stroke-width="1.2"/>
  <text class="lab acc" x="92.0" y="237.5">全体の4.5倍</text>
  <line x1="640.0" y1="207.3" x2="640.0" y2="278.1" stroke="#2563eb" stroke-width="1.2"/>
  <text class="lab acc" x="648.0" y="247.2">全体の3.0倍</text>

  <!-- 出典 -->
  <text class="src" x="24" y="376">出典：厚生労働省「2025年 国民生活基礎調査の概況」表11より作成</text>
