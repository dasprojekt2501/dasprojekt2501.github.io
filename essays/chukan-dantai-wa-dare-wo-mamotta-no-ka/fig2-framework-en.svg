<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">Figure 2. Three channels and three criteria</title>
  <desc id="fig2-desc">The state, intermediary groups, members, and nonmembers. A thick arrow shows protection through membership; a dashed line fails to reach nonmembers. Thin arrows show universal protection through rights and counterpower through association. Three criteria: autonomy from the state, voluntary membership, and openness to nonmembers.</desc>
  <style>
    text { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Yu Gothic','Meiryo',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1f1f1f; }
    .sub { font-size: 12px; fill: #5f6368; }
    .src { font-size: 11.5px; fill: #5f6368; }
    .lab { font-size: 13px; fill: #1f1f1f; }
    .tick { font-size: 12px; fill: #5f6368; }
    .acc { fill: #2563eb; font-weight: 700; }
    .gry { fill: #4d5156; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .crit { font-size: 14px; font-weight: 700; fill: #2563eb; }
    .q { font-size: 11px; fill: #5f6368; }
    .circ { font-size: 13px; fill: #1f1f1f; }
    .circ-b { font-size: 14px; font-weight: 700; fill: #1f1f1f; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 8" refX="0" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 4L0 8z" fill="#3c4043"/>
    </marker>
    <marker id="head-bold" viewBox="0 0 14 12" refX="0" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L14 6L0 12z" fill="#3c4043"/>
    </marker>
  </defs>
  <rect width="760" height="496" fill="#ffffff"/>

  
  <text class="title" x="24" y="36">Postwar Japan relied heavily on protection through membership</text>
  <text class="sub" x="24" y="60">Line weight indicates each channel’s strength. Dashed lines show protection failing to reach outsiders.</text>
  <text class="sub" x="24" y="79">Blue labels: three criteria for assessing intermediary groups.</text>

  
  <g>
    <rect x="230" y="104" width="300" height="56" rx="8" fill="#f6f7f9" stroke="#c7cbd1" stroke-width="1"/>
    <text x="380" y="128.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#1f1f1f">State</text>
    <text x="380" y="148.0" text-anchor="middle" style="font-size:11px;fill:#5f6368">Redistribution · social insurance · public assistance</text>
  </g>
  <g>
    <rect x="200" y="254" width="360" height="72" rx="8" fill="#e5ecfd" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="286.0" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#1f1f1f">Intermediary groups</text>
    <text x="380" y="306.0" text-anchor="middle" style="font-size:11px;fill:#5f6368">Companies · families · neighborhoods · unions · cooperatives</text>
  </g>
  <g>
    <rect x="150" y="416" width="220" height="56" rx="8" fill="#f6f7f9" stroke="#c7cbd1" stroke-width="1"/>
    <text x="260" y="440.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#1f1f1f">Members</text>
    <text x="260" y="460.0" text-anchor="middle" style="font-size:12.5px;fill:#5f6368">People belonging to the group</text>
  </g>
  <g>
    <rect x="430" y="416" width="220" height="56" rx="8" fill="#f6f7f9" stroke="#c7cbd1" stroke-width="1"/>
    <text x="540" y="440.0" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#1f1f1f">Nonmembers</text>
    <text x="540" y="455" text-anchor="middle" style="font-size:10px;fill:#5f6368">Nonregular workers, single adults,</text><text x="540" y="468" text-anchor="middle" style="font-size:10px;fill:#5f6368">single parents, etc.</text>
  </g>

  
  <path d="M230 132H64V444H140" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M530 132H700V444H660" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="circ" x="74" y="284">Protection</text>
  <text class="circ" x="74" y="302">through rights</text><text class="tick" x="74" y="320">(universal benefits)</text>
  <text class="circ" x="690" y="284" text-anchor="end">Protection</text>
  <text class="circ" x="690" y="302" text-anchor="end">through rights</text><text class="tick" x="690" y="320" text-anchor="end">(universal benefits)</text>

  
  <path d="M380 254V170" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#head)"/>
  <text class="circ" x="392" y="212">Counterpower through</text><text class="circ" x="392" y="230">association (voice)</text>
  <text class="crit" x="368" y="204" text-anchor="end">Autonomy</text>
  <text class="q" x="368" y="222" text-anchor="end">Independent of the state?</text>

  
  <path d="M260 326V402" fill="none" stroke="#3c4043" stroke-width="3.5" marker-end="url(#head-bold)"/>
  <text class="circ-b" x="248" y="376" text-anchor="end">Protection through</text><text class="circ-b" x="248" y="394" text-anchor="end">membership</text>
  <text class="crit" x="272" y="368">Voluntariness</text>
  <text class="q" x="272" y="386">Free to leave without penalty?</text>

  
  <path d="M500 326V398" fill="none" stroke="#8c9096" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="crit" x="512" y="368">Openness</text>
  <text class="q" x="512" y="386">Are outsiders excluded?</text>
</svg>
