<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">Figure 1. Relative poverty rates, 1985–2024</title>
  <desc id="fig1-desc">One-adult households with children: 54.5% in 1985, a peak of 63.1% in 1997, and 44.7% in 2024. Overall: 12.0% in 1985 and 15.0% in 2024. Both old and new standards are shown for 2018.</desc>
  <style>
    text { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Yu Gothic','Meiryo',sans-serif; }
    .title { font-size: 17px; font-weight: 700; fill: #1f1f1f; }
    .sub { font-size: 13px; fill: #5f6368; }
    .src { font-size: 11.5px; fill: #5f6368; }
    .lab { font-size: 13px; fill: #1f1f1f; }
    .tick { font-size: 12px; fill: #5f6368; }
    .acc { fill: #2563eb; font-weight: 700; }
    .gry { fill: #4d5156; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <rect width="760" height="390" fill="#ffffff"/>

  
  <text class="title" x="24" y="36">One-adult households with children: poverty at 3–4.5 times the overall rate</text>
  <text class="sub" x="24" y="60">Relative poverty rate (%). Income years (the year before each survey).</text>
  <text class="sub" x="24" y="79">One-adult households with children: working-age households with children and one adult.</text>

  
